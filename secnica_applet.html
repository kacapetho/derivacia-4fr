<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Definícia derivácie v bode (Sečnica → Dotyčnica) / Nombre dérivé : sécante → tangente</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --surface: #f8fafc;
      --border: #cbd5e1;
      --border-soft: #e2e8f0;
      --fg: #0f172a;
      --muted: #475569;
      --primary: #0284c7;
      --primary-fg: #ffffff;
      --hover: #e2e8f0;
    }
    html.dark {
      --bg: #0b1120;
      --card: #111827;
      --surface: #1e293b;
      --border: #334155;
      --border-soft: #1e293b;
      --fg: #f1f5f9;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --primary-fg: #0f172a;
      --hover: #334155;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 14px;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
    .header { padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    .title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
    .badge-class { padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface); border: 1px solid var(--border); }
    .subtitle { margin: 2px 0 0 0; font-size: 12px; color: var(--muted); }
    .header-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .segmented { display: inline-flex; align-items: center; gap: 3px; padding: 3px; border-radius: 9px; background: var(--surface); border: 1px solid var(--border); }
    button { font-family: inherit; cursor: pointer; border: none; background: transparent; color: var(--fg); transition: background-color 0.15s, color 0.15s, opacity 0.15s; }
    .seg-btn { padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
    .seg-btn:hover { background: var(--hover); color: var(--fg); }
    .seg-btn.active { background: var(--primary); color: var(--primary-fg); }
    .steps-bar { padding: 10px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .steps-label { font-size: 12px; font-weight: 700; color: var(--muted); margin-right: 4px; }
    .step-btn { padding: 6px 11px; border-radius: 8px; font-size: 12px; font-weight: 600; background: var(--surface); border: 1px solid var(--border); display: inline-flex; align-items: center; gap: 4px; }
    .step-btn:hover { background: var(--hover); }
    .step-btn.active { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
    .main-grid { display: grid; grid-template-columns: 1fr; gap: 12px; align-items: start; }
    @media (min-width: 1024px) { .main-grid { grid-template-columns: 8fr 4fr; } }
    .left-col, .sidebar { display: flex; flex-direction: column; gap: 12px; }
    .canvas-card { overflow: hidden; }
    .canvas-topbar { padding: 8px 12px; border-bottom: 1px solid var(--border-soft); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; }
    .topbar-left, .topbar-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-weight: 600; font-size: 12px; }
    .drag-hint { color: var(--muted); font-size: 12px; }
    .btn-small { padding: 4px 9px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); font-size: 12px; font-weight: 600; }
    .btn-small:hover { background: var(--hover); }
    .canvas-wrap { position: relative; width: 100%; height: 420px; }
    @media (min-width: 640px) { .canvas-wrap { height: 480px; } }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
    .controls-box { padding: 12px; border-top: 1px solid var(--border-soft); background: var(--surface); display: flex; flex-direction: column; gap: 10px; }
    .btn-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .btn-primary { padding: 7px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; background: var(--primary); color: var(--primary-fg); display: inline-flex; align-items: center; gap: 4px; }
    .btn-primary:hover { opacity: 0.92; }
    .btn-secondary { padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; background: var(--card); border: 1px solid var(--border); display: inline-flex; align-items: center; gap: 4px; }
    .btn-secondary:hover { background: var(--hover); }
    .h-btn { padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 500; background: var(--card); border: 1px solid var(--border); }
    .h-btn:hover { background: var(--hover); }
    .h-btn.zero { background: var(--hover); font-weight: 700; }
    .sliders-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 640px) { .sliders-grid { grid-template-columns: 1fr 1fr; } }
    .slider-row { display: flex; align-items: center; gap: 8px; }
    .slider-lbl { font-size: 13px; font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
    input[type="range"] { width: 100%; accent-color: var(--primary); cursor: pointer; }
    .panel { padding: 12px; display: flex; flex-direction: column; gap: 9px; }
    .panel-title { margin: 0; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    select { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--fg); font-family: inherit; font-size: 12px; font-weight: 600; }
    .custom-params { padding: 9px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border-soft); display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
    .custom-params.hidden { display: none; }
    .param-row { display: flex; align-items: center; gap: 8px; }
    .param-lbl { width: 64px; font-weight: 600; }
    .formula-stack { display: flex; flex-direction: column; gap: 6px; }
    .tex-display-row { display: flex; align-items: center; padding: 7px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border-soft); border-left: 3px solid #0284c7; overflow-x: auto; }
    .tex-display-row.deriv-row { border-left-color: #e11d48; }
    .toggle-list { display: flex; flex-direction: column; gap: 4px; }
    .toggle-item { display: flex; align-items: flex-start; gap: 9px; padding: 6px 8px; border-radius: 8px; font-size: 12px; cursor: pointer; user-select: none; }
    .toggle-item:hover { background: var(--surface); }
    .toggle-item input[type="checkbox"] { margin-top: 2px; accent-color: var(--primary); cursor: pointer; }
    .swatch { width: 10px; height: 10px; border-radius: 999px; margin-top: 4px; flex-shrink: 0; }
    .readout-box { padding: 8px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border-soft); font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
    .readout-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .readout-lbl { color: var(--muted); font-size: 12px; }
    .readout-val { font-size: 14px; font-weight: 600; overflow-x: auto; padding: 2px 0; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--border-soft); }
    th { color: var(--muted); border-bottom: 1px solid var(--border); }

    /* Authentic TeX / LaTeX Mathematical Typesetting */
    .tex { font-family: "KaTeX_Main", "Latin Modern Math", "STIX Two Math", "Cambria Math", "Times New Roman", Georgia, serif; font-size: 1.06em; line-height: 1.25; letter-spacing: 0.01em; white-space: nowrap; display: inline-flex; align-items: center; }
    .tex-wrap { white-space: normal; flex-wrap: wrap; row-gap: 0.25em; }
    .tex-var { font-style: italic; }
    .tex-op { font-style: normal; margin: 0 0.14em; }
    .tex-upright, .tex-text { font-style: normal; }
    .tex-prime { font-style: normal; margin-left: 0.04em; }
    .tex-bin, .tex-rel { font-style: normal; margin: 0 0.22em; }
    .tex-unary { font-style: normal; margin-right: 0.04em; }
    .tex-thin { display: inline-block; width: 0.16em; }
    .tex-med { display: inline-block; width: 0.28em; }
    .tex-frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 0.18em; line-height: 1.08; }
    .tex-frac > .num { border-bottom: 1.25px solid currentColor; padding: 0 0.26em 0.1em; font-size: 0.86em; }
    .tex-frac > .den { padding: 0.1em 0.26em 0; font-size: 0.86em; }
    .tex-sup { font-size: 0.72em; line-height: 0; position: relative; top: -0.45em; margin-left: 0.04em; }
    .tex-sub { font-size: 0.72em; line-height: 0; position: relative; bottom: -0.28em; margin-left: 0.03em; }
    .tex-supsub { display: inline-flex; flex-direction: column; vertical-align: middle; line-height: 0.9; font-size: 0.72em; margin-left: 0.04em; }
    .tex-lim { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.0; margin-right: 0.22em; }
    .tex-lim > .lim-op { font-style: normal; }
    .tex-lim > .lim-sub { font-size: 0.72em; margin-top: 0.08em; }
    .tex-sqrt { display: inline-flex; align-items: stretch; vertical-align: middle; margin: 0 0.1em; }
    .tex-sqrt > .rad { font-style: normal; margin-right: 0.04em; }
    .tex-sqrt > .radicand { border-top: 1.2px solid currentColor; padding: 0.08em 0.18em 0 0.14em; }
    .tex-lr { display: inline-flex; align-items: center; }
    .tex-delim { font-style: normal; font-weight: 400; }
    .tex-delim-tall { font-size: 1.38em; line-height: 0.9; font-weight: 300; transform: scaleY(1.16); display: inline-block; margin: 0 0.03em; }
  </style>
</head>
<body>
  <div class="container">
    <header class="card header">
      <div>
        <div class="title-row">
          <h1 id="ui-title"></h1>
          <span class="badge-class">4.FR</span>
        </div>
        <p id="ui-subtitle" class="subtitle"></p>
      </div>
      <div class="header-controls">
        <div class="segmented" role="group" aria-label="Notation">
          <button type="button" data-not="h" class="seg-btn not-btn"></button>
          <button type="button" data-not="x" class="seg-btn not-btn"></button>
        </div>
        <div class="segmented" role="group" aria-label="Language">
          <button type="button" data-lang="sk" class="seg-btn lang-btn">SK</button>
          <button type="button" data-lang="fr" class="seg-btn lang-btn">FR</button>
          <button type="button" data-lang="bi" class="seg-btn lang-btn">SK + FR</button>
        </div>
        <button type="button" id="btn-theme" class="btn-small" title="Theme">🌙</button>
      </div>
    </header>

    <section class="card steps-bar">
      <span id="ui-steps-label" class="steps-label"></span>
      <button type="button" data-step="1" class="step-btn"></button>
      <button type="button" data-step="2" class="step-btn"></button>
      <button type="button" data-step="3" class="step-btn"></button>
      <button type="button" data-step="4" class="step-btn"></button>
    </section>

    <div class="main-grid">
      <div class="left-col">
        <div class="card canvas-card">
          <div class="canvas-topbar">
            <div class="topbar-left">
              <span id="status-badge" class="status-badge"></span>
              <span id="ui-drag-hint" class="drag-hint"></span>
            </div>
            <div class="topbar-right">
              <div class="segmented">
                <button type="button" data-drag="M" class="seg-btn drag-mode-btn"></button>
                <button type="button" data-drag="A" class="seg-btn drag-mode-btn"></button>
              </div>
              <button type="button" id="btn-zoom-in" class="btn-small">+</button>
              <button type="button" id="btn-zoom-out" class="btn-small">−</button>
              <button type="button" id="btn-zoom-reset" class="btn-small">1:1</button>
            </div>
          </div>

          <div id="canvas-wrap" class="canvas-wrap">
            <canvas id="scene"></canvas>
          </div>

          <div class="controls-box">
            <div class="btn-row">
              <button type="button" id="btn-approach" class="btn-primary"></button>
              <button type="button" id="btn-clear-fan" class="btn-secondary"></button>
              <button type="button" id="btn-record-row" class="btn-secondary"></button>
              <button type="button" id="btn-fill-series" class="btn-secondary"></button>
            </div>

            <div>
              <div id="lbl-h-presets" style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;"></div>
              <div class="btn-row">
                <button type="button" data-h="-2" class="h-btn">−2</button>
                <button type="button" data-h="-1" class="h-btn">−1</button>
                <button type="button" data-h="-0.5" class="h-btn">−0.5</button>
                <button type="button" data-h="-0.1" class="h-btn">−0.1</button>
                <button type="button" data-h="-0.01" class="h-btn">−0.01</button>
                <button type="button" data-h="-0.001" class="h-btn">−0.001</button>
                <button type="button" data-h="0" class="h-btn zero">h = 0</button>
                <button type="button" data-h="0.001" class="h-btn">+0.001</button>
                <button type="button" data-h="0.01" class="h-btn">+0.01</button>
                <button type="button" data-h="0.1" class="h-btn">+0.1</button>
                <button type="button" data-h="0.5" class="h-btn">+0.5</button>
                <button type="button" data-h="1" class="h-btn">+1</button>
                <button type="button" data-h="2" class="h-btn">+2</button>
              </div>
            </div>

            <div class="sliders-grid">
              <div class="slider-row">
                <label for="slider-x0" class="slider-lbl"><span id="lbl-slider-x0"></span><span id="val-slider-x0"></span></label>
                <input id="slider-x0" type="range" min="-3" max="3" step="0.05" value="1.0" />
              </div>
              <div class="slider-row">
                <label for="slider-h" class="slider-lbl"><span id="lbl-slider-h"></span><span id="val-slider-h"></span></label>
                <input id="slider-h" type="range" min="-2.5" max="2.5" step="0.01" value="1.5" />
              </div>
            </div>
          </div>

        <div class="card panel">
          <div class="panel-header">
            <h2 id="ui-table-title" class="panel-title"></h2>
            <button type="button" id="btn-clear-table" class="btn-small"></button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th id="th-h"></th>
                  <th id="th-x"></th>
                  <th id="th-fx"></th>
                  <th id="th-dy"></th>
                  <th id="th-ksec"></th>
                </tr>
              </thead>
              <tbody id="conv-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="sidebar">
        <div class="card panel">
          <label for="select-fn" id="ui-fn-label" class="panel-title"></label>
          <select id="select-fn"></select>
          <div id="custom-params" class="custom-params hidden">
            <div class="param-row"><span class="param-lbl" id="lbl-param-a"></span><input id="param-a" type="range" min="-1.5" max="1.5" step="0.1" value="0.5" /></div>
            <div class="param-row"><span class="param-lbl" id="lbl-param-b"></span><input id="param-b" type="range" min="-3" max="3" step="0.2" value="0" /></div>
            <div class="param-row"><span class="param-lbl" id="lbl-param-c"></span><input id="param-c" type="range" min="-2" max="3" step="0.2" value="0" /></div>
          </div>
          <div class="formula-stack">
            <div id="fn-latex-row" class="tex-display-row"></div>
            <div id="fp-latex-row" class="tex-display-row deriv-row"></div>
          </div>
        </div>

        <div class="card panel">
          <h2 id="ui-layers-label" class="panel-title"></h2>
          <div class="toggle-list">
            <label class="toggle-item"><input id="chk-point-a" type="checkbox" checked /><span class="swatch" style="background:#0284c7"></span><span id="lbl-chk-point-a"></span></label>
            <label class="toggle-item"><input id="chk-point-m" type="checkbox" checked /><span class="swatch" style="background:#7c3aed"></span><span id="lbl-chk-point-m"></span></label>
            <label class="toggle-item"><input id="chk-triangle" type="checkbox" checked /><span class="swatch" style="background:#10b981"></span><span id="lbl-chk-triangle"></span></label>
            <label class="toggle-item"><input id="chk-secant" type="checkbox" checked /><span class="swatch" style="background:#f59e0b"></span><span id="lbl-chk-secant"></span></label>
            <label class="toggle-item"><input id="chk-fan" type="checkbox" /><span class="swatch" style="background:#94a3b8"></span><span id="lbl-chk-fan"></span></label>
            <label class="toggle-item"><input id="chk-tangent" type="checkbox" /><span class="swatch" style="background:#e11d48"></span><span id="lbl-chk-tangent"></span></label>
          </div>
        </div>

        <div class="card panel">
          <h2 id="ui-readout-label" class="panel-title"></h2>
          <div class="readout-box">
            <div id="lbl-secant-formula" class="readout-lbl"></div>
            <div id="val-secant-calc" class="readout-val"></div>
          </div>
          <div class="readout-grid">
            <div class="readout-box"><div id="lbl-coord-a" class="readout-lbl"></div><div id="val-coord-a" class="readout-val"></div></div>
            <div class="readout-box"><div id="lbl-coord-m" class="readout-lbl"></div><div id="val-coord-m" class="readout-val"></div></div>
          </div>
          <div class="readout-box" style="border-color:var(--border)">
            <div id="lbl-limit-def" class="readout-lbl" style="font-weight:600"></div>
            <div id="val-limit-def" class="readout-val"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      function texToHtml(str) {
        let i = 0;
        const n = str.length;
        function skipSpaces() { while (i < n && str[i] === ' ') i++; }
        function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        function readBraced() {
          i++; let depth = 1; const start = i;
          while (i < n && depth > 0) {
            if (str[i] === '\\' && i + 1 < n) { i += 2; continue; }
            if (str[i] === '{') depth++; else if (str[i] === '}') depth--;
            if (depth > 0) i++;
          }
          const c = str.slice(start, i); if (i < n && str[i] === '}') i++; return c;
        }
        function readArg() {
          skipSpaces();
          if (i >= n) return '';
          if (str[i] === '{') return readBraced();
          if (str[i] === '\\') {
            const s = i; i++; while (i < n && /[a-zA-Z]/.test(str[i])) i++;
            if (i === s + 1 && i < n) i++; return str.slice(s, i);
          }
          return str[i++];
        }
        function readCommand() {
          i++; if (i >= n) return '';
          if (!/[a-zA-Z]/.test(str[i])) return str[i++];
          const s = i; while (i < n && /[a-zA-Z]/.test(str[i])) i++;
          return str.slice(s, i);
        }
        function parseRange() {
          let out = '', expectOperand = true;
          while (i < n) {
            const ch = str[i];
            if (ch === ' ') { i++; continue; }
            if (ch === '}') break;
            if (ch === '{') { out += texToHtml(readBraced()); expectOperand = false; continue; }
            if (ch === '\\') {
              const cmd = readCommand();
              if (cmd === 'frac') {
                const num = readArg(), den = readArg();
                out += `<span class="tex-frac"><span class="num">${texToHtml(num)}</span><span class="den">${texToHtml(den)}</span></span>`;
                expectOperand = false; continue;
              }
              if (cmd === 'sqrt') {
                out += `<span class="tex-sqrt"><span class="rad">√</span><span class="radicand">${texToHtml(readArg())}</span></span>`;
                expectOperand = false; continue;
              }
              if (cmd === 'lim') {
                skipSpaces();
                if (i < n && str[i] === '_') { i++; out += `<span class="tex-lim"><span class="lim-op">lim</span><span class="lim-sub">${texToHtml(readArg())}</span></span>`; }
                else out += '<span class="tex-op">lim</span>';
                expectOperand = true; continue;
              }
              if (cmd === 'text') { out += `<span class="tex-text">${escapeHtml(readArg())}</span>`; expectOperand = false; continue; }
              if (cmd === 'left') {
                skipSpaces(); const od = i < n ? str[i++] : '(';
                let depth = 1, is = i, ie = i, cd = ')';
                while (i < n && depth > 0) {
                  if (str.startsWith('\\left', i) && !/[a-zA-Z]/.test(str[i + 5] || '')) { depth++; i += 5; }
                  else if (str.startsWith('\\right', i) && !/[a-zA-Z]/.test(str[i + 6] || '')) {
                    depth--;
                    if (depth === 0) { ie = i; i += 6; skipSpaces(); if (i < n) cd = str[i++]; break; }
                    i += 6;
                  } else i++;
                }
                const ih = texToHtml(str.slice(is, ie));
                const dc = ih.includes('tex-frac') ? 'tex-delim tex-delim-tall' : 'tex-delim';
                out += `<span class="tex-lr"><span class="${dc}">${od === '.' ? '' : escapeHtml(od)}</span><span>${ih}</span><span class="${dc}">${cd === '.' ? '' : escapeHtml(cd)}</span></span>`;
                expectOperand = false; continue;
              }
              if (cmd === 'right') { if (i < n) i++; continue; }
              if (cmd === 'sin' || cmd === 'cos' || cmd === 'tan') { out += `<span class="tex-op">${cmd}</span>`; expectOperand = true; continue; }
              if (cmd === 'Delta') { out += '<span class="tex-upright">Δ</span>'; expectOperand = false; continue; }

      function drawCurve(vp, fn, pal) {

        }

      }

      function drawCanvasOverlayRatio(fn, pal, validM, zeroH, kSec) {

        if (state.showTangent && zeroH) {

        } else if (zeroH) {

        const nw = measureRuns(nRuns), dw = measureRuns(dRuns), fracW = Math.max(nw, dw) + 10;
        const rRuns = parseRuns(resText), rw = measureRuns(rRuns), padX = 11, boxW = padX * 2 + lw + fracW + rw;
        ctx.fillStyle = pal.labelBg; ctx.strokeStyle = boxColor; ctx.lineWidth = 1.3;

      function draw() {

        const x0 = state.x0, xM = x0 + state.h, validA = fn.valid(x0), validM = fn.valid(xM), zeroH = Math.abs(state.h) < 1e-6;
        ctx.fillStyle = pal.bg; ctx.fillRect(0, 0, w, h);

          }

          ctx.beginPath(); ctx.moveTo(vp.px(xL), vp.py(y0 + slope * (xL - x0))); ctx.lineTo(vp.px(xR), vp.py(y0 + slope * (xR - x0))); ctx.stroke(); ctx.restore();
        }

          if (Math.abs(pMy - pAy) > 20) drawMathPill(pMx + (state.h >= 0 ? 44 : -44), (pAy + pMy) / 2, `Δy = ${fmtShort(dy)}`, dyCol, dyCol, pal);
          ctx.restore();
        }
        if (state.showPointA && validA) {

          ctx.beginPath(); ctx.moveTo(pMx, pMy); ctx.lineTo(pMx, axY); ctx.moveTo(pMx, pMy); ctx.lineTo(axX, pMy); ctx.stroke(); ctx.setLineDash([]);
          ctx.fillStyle = pal.pointM; ctx.strokeStyle = pal.dotStroke; ctx.lineWidth = 2;

      document.getElementById('btn-zoom-reset').addEventListener('click', () => { state.zoom = 1.0; draw(); });

      canvas.addEventListener('pointerdown', (e) => {
        state.approaching = false; state.dragging = true;
        const rect = canvas.getBoundingClientRect(), vp = getViewport(rect.width, rect.height); state.dragVp = vp;
        const fn = getFn(), px = e.clientX - rect.left, py = e.clientY - rect.top;
        const dA = fn.valid(state.x0) ? Math.hypot(px - vp.px(state.x0), py - vp.py(fn.f(state.x0))) : 999;
        const dM = fn.valid(state.x0 + state.h) ? Math.hypot(px - vp.px(state.x0 + state.h), py - vp.py(fn.f(state.x0 + state.h))) : 999;
        if (dA < 22 && dA < dM) state.dragTarget = 'A'; else if (dM < 22) state.dragTarget = 'M'; else state.dragTarget = state.dragMode;
        canvas.setPointerCapture(e.pointerId); handleCanvasDrag(e.clientX);
      });
      canvas.addEventListener('pointermove', (e) => { if (state.dragging) handleCanvasDrag(e.clientX); });
      canvas.addEventListener('pointerup', (e) => { state.dragging = false; state.dragVp = null; if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId); });

      function handleCanvasDrag(clientX) {
        const rect = canvas.getBoundingClientRect(), vp = state.dragVp || getViewport(rect.width, rect.height), fn = getFn();
        const wx = vp.wx(clientX - rect.left);
        if (state.dragTarget === 'A') { state.x0 = Math.max(fn.xMin, Math.min(fn.xMax, wx)); state.secantFan = []; }
        else { state.h = Math.max(-3.0, Math.min(3.0, wx - state.x0)); recordFanLine(); }
        syncControls(); draw();
      }
      function tick(ts) {
        if (state.approaching) {
          if (state.lastTs === null) state.lastTs = ts;
          const dt = Math.min(0.05, (ts - state.lastTs) / 1000); state.lastTs = ts;
          state.h *= Math.pow(0.32, dt); recordFanLine();
          if (Math.abs(state.h) < 0.002) { state.h = state.h < 0 ? -0.001 : 0.001; state.approaching = false; }
          syncControls(); draw();
        }
        requestAnimationFrame(tick);
      }
      if (window.ResizeObserver) new ResizeObserver(() => draw()).observe(canvasWrap);
      window.addEventListener('resize', draw);
      syncControls(); syncLanguageUI(); draw(); requestAnimationFrame(tick);
    })();
  </script>
</body>
